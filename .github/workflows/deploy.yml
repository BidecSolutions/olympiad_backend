name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/olympiad/production/backend
            git fetch origin main
            git reset --hard origin/main
            docker compose -p olympiad-backend build --no-cache php-fpm
            docker compose -p olympiad-backend up -d
            docker compose -p olympiad-backend exec -T php-fpm php artisan migrate --force
            docker compose -p olympiad-backend exec -T php-fpm php artisan config:cache
            docker compose -p olympiad-backend exec -T php-fpm php artisan route:cache
            docker image prune -f
